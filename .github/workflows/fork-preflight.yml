name: Fork PR preflight

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA from a branch in this fork
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-pr-preflight-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify tested commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: npm run lint:eslint:loud
      - run: npm run prettier:check
      - run: npm run build:integrated
      - run: npm run test

  code-coverage:
    name: code-coverage (${{ matrix.coverage.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        coverage:
          - name: Abstractions
            path: ./packages/abstractions/coverage
          - name: Authentication Azure
            path: ./packages/authentication/azure/coverage
          - name: Authentication Spfx
            path: ./packages/authentication/spfx/coverage
          - name: Http Fetch
            path: ./packages/http/fetch/coverage
          - name: Serialization Form
            path: ./packages/serialization/form/coverage
          - name: Serialization JSON
            path: ./packages/serialization/json/coverage
          - name: Serialization Text
            path: ./packages/serialization/text/coverage
          - name: Serialization Multipart
            path: ./packages/serialization/multipart/coverage
          - name: Bundle
            path: ./packages/bundle/coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Verify tested commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.sha }}"
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - name: Code Coverage Report ${{ matrix.coverage.name }}
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: ${{ matrix.coverage.path }}/cobertura-coverage.xml
          format: markdown
          hide_branch_rate: false
          output: both
          badge: true

  matrix-gate:
    name: check-typescript-version-matrix
    runs-on: ubuntu-latest
    needs: [build, code-coverage]
    if: always()
    steps:
      - name: All matrix jobs passed
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: exit 0
      - name: A matrix job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
